<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocks</title>
    <style>
        body {
            background: bisque;
        }
        p {
            background: lavender;
            color: aqua;
            font-size: 50px;
            display: block;
        }
        span {
            color: blue;
            font-style: italic;
        }
        ul {
            list-style: none;
        }
        li {
            display: inline-block;
        }
        li:hover {
            background: yellow;
            color: greenyellow;
            font-size: 1.2em;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #first {
            background: aquamarine;
            width: 400px;
            height: 400px;
            font-size: 36px;
            color: blue;
            display: flex;
            justify-items: center;
            align-items: center;
            border-width: 30px;
            border-style:dotted dashed groove ridge;
            border-color: red fuchsia pink greenyellow;
            border-radius: 5% 10%;
            margin-bottom: 40px;
        }
        #second {
            width: 500px;
            height: 800px;
            background: yellow;
            border-width: 10px;
            border-style: solid;
            border-color: navy;
        }
        #third, #fourth {
            width: 600px;
            height: 200px;
            background: teal;
            margin: 50px;
            border-width: 5px;
            border-style: solid;
            border-color: black;
        }
        #third {
            border-radius: 15%;
            border-style: dotted;
            border-color: purple;
        }
        #fourth {
            border-radius: 30%;
            border-style: double;
            border-color: aquamarine;
        }
        #fifth {
            width: 380px;
            height: 195px;
            background: red;
            margin: 50px;
            border-width: 5px;
            border-style: solid;
            border-color: greenyellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #sixth, #seventh {
            width: 190px;
            height: 97.5px;
            background: blue;
            margin: 50px;
            border-width: 5px;
            border-style: solid;
            border-color: yellow;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #seventh {
            width: 95px;
            height: 48.75px;
            background: pink;
            margin: 50px;
            border-width: 5px;
            border-style: solid;
            border-color: blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <p>Ми<span> вивчаемо</span> блоки</p>
    <p>Ми вивчаемо<span> блоки</span></p>
    <ul>
        <li>Example</li>
        <li>Another Example</li>
        <li>Yet Another Example</li>
    </ul>
<div id="first">Привіт я перший блок</div>
<div id="second">
    <div id="third"></div>
    <div id="fourth"></div>
</div>
    <div id="fifth">
        <div id="sixth">
            <div id="seventh">
            </div>
        </div>
    </div>
</body>
</html>
